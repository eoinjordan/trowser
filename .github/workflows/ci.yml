name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate dist
        run: npm run validate

      - name: Package extension
        run: npm run package

      - name: Build landing page
        run: npm run build:site

      - name: Upload unpacked extension
        if: matrix.node == '22'
        uses: actions/upload-artifact@v5
        with:
          name: trowser-unpacked
          path: dist/
          retention-days: 14

      - name: Upload packaged extension
        if: matrix.node == '22'
        uses: actions/upload-artifact@v5
        with:
          name: trowser-zip
          path: artifacts/
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Advisories in build-only tooling should not block a merge, so this
      # reports at high severity and does not gate the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
